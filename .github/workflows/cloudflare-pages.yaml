name: deploy contents to cloudflare pages
on:
  push:
    branches:
    - main
    paths:
    - 'audio/**'
    - 'episode/**'
    - 'static/**'
    - 'template/**'
    - index.md
    - podbard.yaml
    - .github/workflows/cloudflare-pages.yaml
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
jobs:
  cloudflare-pages:
    if: github.repository == 'Songmu/oss4.fun'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install podbard and build site
      uses: Songmu/podbard@9cfe3379f66179bf3453bab4b776e970409bddc2 # v0.0.19
    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy public --project-name=oss4fun
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
